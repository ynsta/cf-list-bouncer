# ko builds the container image straight from the Go module: no Dockerfile.
# The base is pinned by digest so a rebuild of the same tag is reproducible; Dependabot
# does not update it, bump it by hand with:
#   docker buildx imagetools inspect gcr.io/distroless/static-debian13:nonroot
defaultBaseImage: gcr.io/distroless/static-debian13:nonroot@sha256:25ac8f0c3b2334a9eb05452266bd4697864a8c8ef0ef71e5e6480d7f92868329
defaultPlatforms:
  - linux/amd64
  - linux/arm64
builds:
  - id: cf-list-bouncer
    main: ./cmd/cf-list-bouncer
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Env.VERSION}}
